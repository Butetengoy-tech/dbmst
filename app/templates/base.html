<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080B11">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DBMST">
    <title>DBMST | Davnor Blue Marlins</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='image/logo.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='image/logo_bluemarlins.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Tailwind CSS (CDN for dev, build step for prod) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Calistoga', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        background: 'var(--background)',
                        foreground: 'var(--foreground)',
                        muted: 'var(--muted)',
                        'muted-foreground': 'var(--muted-foreground)',
                        accent: 'var(--accent)',
                        'accent-secondary': 'var(--accent-secondary)',
                        border: 'var(--border)',
                        card: 'var(--card)',
                        ring: 'var(--ring)',
                    }
                }
            }
        }
    </script>
    <style>
  :root, .dark {
    --background: #121212;
    --foreground: #FFFFFF;
    --muted: #252525;
    --muted-foreground: #98989D;
    --accent: #00E5FF;
    --accent-secondary: #32D74B;
    --alert: #FF453A;
    --border: #2C2C2E;
    --card: #1E1E1E;
    --ring: #00E5FF;
  }

  /* Layout & Section Badges */
  .section-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    border-radius: 9999px;
    border: 1px solid rgba(0, 229, 255, 0.3);
    background-color: rgba(0, 229, 255, 0.05);
    padding: 0.5rem 1.25rem;
  }
  
  .section-badge-dot {
    height: 0.5rem;
    width: 0.5rem;
    border-radius: 9999px;
    background-color: var(--accent);
    animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  .section-badge-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent);
  }

  /* Gradient Text */
  .gradient-text {
    background: linear-gradient(to right, var(--accent), var(--accent-secondary));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* Cards */
  .modern-card {
    background-color: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: none;
    transition: all 300ms ease-out;
  }
  
  .modern-card:hover {
    border-color: rgba(0, 229, 255, 0.3);
  }

  /* Alerts */
  .watt-alert {
    background-color: #3A1C1C;
    color: var(--alert);
    border-left: 4px solid var(--alert);
    padding: 1rem;
    border-radius: 0.5rem;
  }

  /* Buttons */
  .btn-primary {
    background-color: var(--accent);
    color: #121212;
    font-weight: 600;
    border-radius: 0.75rem;
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 1.5rem;
    transition: all 200ms ease-out;
  }
  
  .btn-primary:hover {
    filter: brightness(1.1);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
  }
  
  .btn-primary:active {
    transform: scale(0.98);
  }

  .btn-secondary {
    background-color: transparent;
    color: var(--foreground);
    font-weight: 500;
    border-radius: 0.75rem;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 1.5rem;
    transition: all 200ms ease-out;
  }
  
  .btn-secondary:hover {
    border-color: rgba(0, 82, 255, 0.3);
    background-color: rgba(241, 245, 249, 0.5);
    transform: translateY(-2px);
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  }

  .btn-success {
    background: linear-gradient(to right, #10b981, #34d399);
    color: #ffffff;
    font-weight: 500;
    border-radius: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 1.5rem;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    transition: all 200ms ease-out;
  }
  .btn-success:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    filter: brightness(1.1);
  }

  .btn-ghost {
    background-color: transparent;
    color: var(--muted-foreground);
    font-weight: 500;
    border-radius: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 1.5rem;
    transition: all 200ms ease-out;
  }
  .btn-ghost:hover {
    color: var(--foreground);
    background-color: rgba(241, 245, 249, 0.5);
  }

  /* Inputs */
  .input-modern {
    width: 100%;
    height: 3rem;
    padding-left: 1rem;
    padding-right: 1rem;
    background-color: transparent;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    color: var(--foreground);
    outline: none;
    transition: all 200ms ease-out;
  }
  
  .input-modern:focus {
    box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--accent);
    border-color: transparent;
  }

  /* Premium Utility Classes */
  .glass-card {
    background: rgba(30, 30, 35, 0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
    border-radius: 1.25rem;
  }

  .glass-card-hover {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .glass-card-hover:hover {
    transform: translateY(-3px);
    border-color: rgba(0, 229, 255, 0.3);
    box-shadow: 0 15px 35px -5px rgba(0, 229, 255, 0.15), 0 0 15px rgba(0, 229, 255, 0.1);
  }

  .glass-input {
    width: 100%;
    height: 3rem;
    padding-left: 1rem;
    padding-right: 1rem;
    background: rgba(15, 15, 18, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 0.85rem;
    color: #FFFFFF;
    outline: none;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .glass-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.25), inset 0 0 10px rgba(0, 229, 255, 0.1);
    background: rgba(20, 20, 26, 0.9);
  }

  .badge-neon {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0.85rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    background: rgba(0, 229, 255, 0.1);
    color: var(--accent);
    border: 1px solid rgba(0, 229, 255, 0.25);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.15);
  }

  .table-glass {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
  }
  .table-glass th {
    background: rgba(20, 20, 24, 0.8);
    color: var(--muted-foreground);
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }
  .table-glass td {
    padding: 1.1rem 1.25rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    transition: background 0.2s ease;
  }
  .table-glass tr:hover td {
    background: rgba(255, 255, 255, 0.03);
  }

  /* Fix for select dropdown options visibility */
  select option {
    background-color: var(--card);
    color: var(--foreground);
  }

  /* Premium Sidebar Styling */
  .premium-sidebar-bg {
    background: linear-gradient(180deg, rgba(22, 22, 26, 0.95) 0%, rgba(15, 15, 18, 0.98) 100%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 4px 0 25px rgba(0, 0, 0, 0.4);
  }

  .sidebar-ambient-glow {
    position: absolute;
    top: -50px;
    left: -50px;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(0, 229, 255, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
    pointer-events: none;
    z-index: 0;
  }

  .sidebar-nav-item {
    position: relative;
    display: flex;
    align-items: center;
    border-radius: 0.85rem;
    font-size: 0.875rem;
    font-weight: 500;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .sidebar-nav-active {
    background: linear-gradient(90deg, rgba(0, 229, 255, 0.15) 0%, rgba(0, 229, 255, 0.03) 100%);
    color: #FFFFFF !important;
    border: 1px solid rgba(0, 229, 255, 0.25);
    box-shadow: 0 4px 20px -2px rgba(0, 229, 255, 0.2), inset 0 0 12px rgba(0, 229, 255, 0.1);
  }

  .sidebar-nav-active::before {
    content: '';
    position: absolute;
    left: -1px;
    top: 20%;
    bottom: 20%;
    width: 3.5px;
    background: var(--accent);
    border-top-right-radius: 4px;
    border-bottom-right-radius: 4px;
    box-shadow: 0 0 10px var(--accent);
  }

  .sidebar-nav-inactive {
    color: #98989D;
    border: 1px solid transparent;
  }

  .sidebar-nav-inactive:hover {
    color: #FFFFFF;
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.08);
    transform: translateX(3px);
  }

  .sidebar-nav-inactive:hover .nav-icon {
    color: var(--accent);
    transform: scale(1.1);
  }

  .custom-scrollbar::-webkit-scrollbar {
    width: 4px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 10px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
  }

  /* Animations */
  @keyframes pulse-slow {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.3); }
  }
  
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .animate-fade-in-up {
    animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  </style>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] font-sans antialiased selection:bg-[var(--accent)] selection:text-white" hx-boost="true" x-data="{ sidebarOpen: false, desktopCollapsed: false }">
    {% block layout %}
        {% block content %}{% endblock %}
    {% endblock %}
    
    {% block scripts %}{% endblock %}

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/static/sw.js').then(function(registration) {
                console.log('DBMST PWA ServiceWorker registration successful with scope: ', registration.scope);
            }, function(err) {
                console.log('DBMST PWA ServiceWorker registration failed: ', err);
            });
        });
    }
    </script>
</body>
</html>
