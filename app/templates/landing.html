{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex flex-col justify-between bg-[#080B11] relative overflow-hidden select-none">

    <!-- 3D Animated WebGL Canvas Container -->
    <canvas id="three-bg" class="absolute inset-0 z-0 opacity-60 pointer-events-none"></canvas>

    <!-- Ambient Glowing Light Orbs -->
    <div
        class="absolute top-[-10%] left-[25%] w-[600px] h-[600px] rounded-full bg-cyan-500/15 blur-[140px] pointer-events-none z-0">
    </div>
    <div
        class="absolute bottom-[-10%] right-[20%] w-[600px] h-[600px] rounded-full bg-blue-600/15 blur-[140px] pointer-events-none z-0">
    </div>
    <div
        class="absolute top-[40%] right-[-10%] w-[400px] h-[400px] rounded-full bg-emerald-500/10 blur-[120px] pointer-events-none z-0">
    </div>

    <!-- Background Grid Overlay -->
    <div class="absolute inset-0 z-0 opacity-10 pointer-events-none"
        style="background-image: radial-gradient(rgba(0, 229, 255, 0.4) 1px, transparent 1px); background-size: 36px 36px;">
    </div>

    <!-- Hero Content Section -->
    <main
        class="flex-1 flex flex-col items-center justify-center px-6 py-16 relative z-10 max-w-5xl mx-auto text-center animate-fade-in-up">

        <!-- Glowing Logo Badge -->
        <div class="relative group mb-8">
            <div
                class="w-28 h-28 sm:w-36 sm:h-36 rounded-3xl bg-slate-900/90 border border-cyan-500/40 p-5 shadow-[0_0_60px_rgba(0,229,255,0.3)] group-hover:shadow-[0_0_90px_rgba(0,229,255,0.5)] group-hover:border-cyan-400 transition-all duration-500 backdrop-blur-xl flex items-center justify-center">
                <img src="{{ url_for('static', filename='image/logo_bluemarlins.png') }}" alt="DBMST Logo"
                    class="w-full h-full object-contain drop-shadow-[0_0_15px_rgba(0,229,255,0.4)] group-hover:scale-105 transition-transform duration-500">
            </div>
        </div>

        <!-- Section Badge -->
        <div class="badge-neon mb-6">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_8px_#00E5FF]"></span>
            <span>Performance & Analytics System</span>
        </div>

        <!-- Title -->
        <h1 class="text-4xl sm:text-6xl md:text-7xl font-serif text-white tracking-tight leading-[1.15] mb-6">
            Davnor <span
                class="bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-teal-300 to-emerald-400 drop-shadow-[0_0_30px_rgba(0,229,255,0.3)]">Blue
                Marlins</span><br>Swim Team
        </h1>

        <!-- Subtitle -->
        <p class="text-slate-400 text-base sm:text-xl max-w-2xl mx-auto mb-10 leading-relaxed font-sans font-normal">
            Swim Hard. Dream Big.
        </p>

        <!-- CTA Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto">
            <a href="{{ url_for('dashboard.index') }}"
                class="w-full sm:w-auto px-8 py-4 rounded-2xl text-base font-semibold text-slate-950 bg-gradient-to-r from-cyan-400 via-teal-300 to-emerald-400 shadow-[0_0_35px_rgba(0,229,255,0.4)] hover:shadow-[0_0_55px_rgba(0,229,255,0.6)] hover:scale-[1.02] transition-all duration-300 flex items-center justify-center gap-3">
                <span>Access Dashboard</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6">
                    </path>
                </svg>
            </a>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-white/10 bg-slate-950/60 backdrop-blur-md py-6 px-6 relative z-10">
        <div
            class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
            <p>&copy; Davnor Blue Marlins Swim Team. All rights reserved.</p>
            <div class="flex items-center gap-2 text-emerald-400 font-mono">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>DBMST by Coach Amil</span>
            </div>
        </div>
    </footer>

</div>

<!-- Three.js Library & 3D Interactive Cyber Wave Shader Script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    (function () {
        const canvas = document.getElementById('three-bg');
        if (!canvas || typeof THREE === 'undefined') return;

        let scene, camera, renderer, particles;
        let count = 0;
        let mouseX = 0, mouseY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        const AMOUNTX = 90;
        const AMOUNTY = 60;
        const SEPARATION = 45;

        function init() {
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.z = 1000;
            camera.position.y = 350;

            scene = new THREE.Scene();

            const numParticles = AMOUNTX * AMOUNTY;
            const positions = new Float32Array(numParticles * 3);
            const scales = new Float32Array(numParticles);

            let i = 0, j = 0;
            for (let ix = 0; ix < AMOUNTX; ix++) {
                for (let iy = 0; iy < AMOUNTY; iy++) {
                    positions[i] = ix * SEPARATION - ((AMOUNTX * SEPARATION) / 2); // x
                    positions[i + 1] = 0; // y
                    positions[i + 2] = iy * SEPARATION - ((AMOUNTY * SEPARATION) / 2); // z

                    scales[j] = 1;

                    i += 3;
                    j++;
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('scale', new THREE.BufferAttribute(scales, 1));

            // Create glowing circular particle canvas texture
            const textureCanvas = document.createElement('canvas');
            textureCanvas.width = 16;
            textureCanvas.height = 16;
            const ctx = textureCanvas.getContext('2d');
            const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0, 'rgba(0, 229, 255, 1)');
            grad.addColorStop(0.4, 'rgba(16, 185, 129, 0.8)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 16, 16);

            const particleTexture = new THREE.CanvasTexture(textureCanvas);

            const material = new THREE.PointsMaterial({
                size: 14,
                map: particleTexture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);

            document.addEventListener('pointermove', onPointerMove);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function onPointerMove(event) {
            mouseX = event.clientX - windowHalfX;
            mouseY = event.clientY - windowHalfY;
        }

        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            render();
        }

        function render() {
            camera.position.x += (mouseX * 0.4 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 0.4 + 350 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            const positions = particles.geometry.attributes.position.array;
            let i = 0;

            for (let ix = 0; ix < AMOUNTX; ix++) {
                for (let iy = 0; iy < AMOUNTY; iy++) {
                    positions[i + 1] = (Math.sin((ix + count) * 0.3) * 60) + (Math.sin((iy + count) * 0.5) * 60);
                    i += 3;
                }
            }

            particles.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);

            count += 0.04;
        }

        init();
    })();
</script>
{% endblock %}
