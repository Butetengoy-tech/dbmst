<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBMST | Davnor Blue Marlins</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='image/logo.ico') }}">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Tailwind CSS (CDN for dev, build step for prod) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Calistoga', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        background: 'var(--background)',
                        foreground: 'var(--foreground)',
                        muted: 'var(--muted)',
                        'muted-foreground': 'var(--muted-foreground)',
                        accent: 'var(--accent)',
                        'accent-secondary': 'var(--accent-secondary)',
                        border: 'var(--border)',
                        card: 'var(--card)',
                        ring: 'var(--ring)',
                    }
                }
            }
        }
    </script>
    <style>
  :root, .dark {
    --background: #121212;
    --foreground: #FFFFFF;
    --muted: #252525;
    --muted-foreground: #98989D;
    --accent: #00E5FF;
    --accent-secondary: #32D74B;
    --alert: #FF453A;
    --border: #2C2C2E;
    --card: #1E1E1E;
    --ring: #00E5FF;
  }

  /* Layout & Section Badges */
  .section-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    border-radius: 9999px;
    border: 1px solid rgba(0, 229, 255, 0.3);
    background-color: rgba(0, 229, 255, 0.05);
    padding: 0.5rem 1.25rem;
  }
  
  .section-badge-dot {
    height: 0.5rem;
    width: 0.5rem;
    border-radius: 9999px;
    background-color: var(--accent);
    animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  .section-badge-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent);
  }

  /* Gradient Text */
  .gradient-text {
    background: linear-gradient(to right, var(--accent), var(--accent-secondary));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* Cards */
  .modern-card {
    background-color: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: none;
    transition: all 300ms ease-out;
  }
  
  .modern-card:hover {
    border-color: rgba(0, 229, 255, 0.3);
  }

  /* Alerts */
  .watt-alert {
    background-color: #3A1C1C;
    color: var(--alert);
    border-left: 4px solid var(--alert);
    padding: 1rem;
    border-radius: 0.5rem;
  }

  /* Buttons */
  .btn-primary {
    background-color: var(--accent);
    color: #121212;
    font-weight: 600;
    border-radius: 0.75rem;
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 1.5rem;
    transition: all 200ms ease-out;
  }
  
  .btn-primary:hover {
    filter: brightness(1.1);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
  }
  
  .btn-primary:active {
    transform: scale(0.98);
  }

  .btn-secondary {
    background-color: transparent;
    color: var(--foreground);
    font-weight: 500;
    border-radius: 0.75rem;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 1.5rem;
    transition: all 200ms ease-out;
  }
  
  .btn-secondary:hover {
    border-color: rgba(0, 82, 255, 0.3);
    background-color: rgba(241, 245, 249, 0.5);
    transform: translateY(-2px);
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  }

  .btn-success {
    background: linear-gradient(to right, #10b981, #34d399);
    color: #ffffff;
    font-weight: 500;
    border-radius: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 1.5rem;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    transition: all 200ms ease-out;
  }
  .btn-success:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    filter: brightness(1.1);
  }

  .btn-ghost {
    background-color: transparent;
    color: var(--muted-foreground);
    font-weight: 500;
    border-radius: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 1.5rem;
    transition: all 200ms ease-out;
  }
  .btn-ghost:hover {
    color: var(--foreground);
    background-color: rgba(241, 245, 249, 0.5);
  }

  /* Inputs */
  .input-modern {
    width: 100%;
    height: 3rem;
    padding-left: 1rem;
    padding-right: 1rem;
    background-color: transparent;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    color: var(--foreground);
    outline: none;
    transition: all 200ms ease-out;
  }
  
  .input-modern:focus {
    box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--accent);
    border-color: transparent;
  }

  /* Fix for select dropdown options visibility */
  select option {
    background-color: var(--card);
    color: var(--foreground);
  }

  /* Sidebar styling */
  .sidebar-wrapper {
    background-color: var(--foreground);
    color: var(--background);
    position: relative;
    overflow: hidden;
  }

  .sidebar-wrapper::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: 0.3;
    pointer-events: none;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    padding: 0.75rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    border-radius: 0.75rem;
    color: rgba(250, 250, 250, 0.7);
    transition: all 200ms ease-out;
    position: relative;
    z-index: 10;
  }
  
  .sidebar-link:hover {
    color: #ffffff;
    background-color: rgba(255, 255, 255, 0.1);
    transform: translateX(0.25rem);
  }
  
  .sidebar-link-active {
    color: #ffffff;
    background-color: var(--accent);
    box-shadow: 0 4px 14px rgba(0, 82, 255, 0.25);
  }

  /* Animations */
  @keyframes pulse-slow {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.3); }
  }
  
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .animate-fade-in-up {
    animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
    </style>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] font-sans antialiased selection:bg-[var(--accent)] selection:text-white" hx-boost="true" x-data="{ sidebarOpen: false, desktopCollapsed: false }">
    {% block layout %}
        {% block content %}{% endblock %}
    {% endblock %}
    
    {% block scripts %}{% endblock %}
</body>
</html>
